# The learning pathways of MESA Trainings: the one source for the pathway pages,
# the by-point list at docs/pathway.md, and docs/assets/pathways.json.
#
# After any change here, or to a tutorial's title, tags, or Time line, run
#     python scripts/gen_pathways.py
# and commit what it writes. CI fails if the generated files have drifted.
#
# A tutorial is named by its file name without ".md". Its title, pathway point,
# time, status, and dates are read from its own page and never repeated here.
#
# To add a tutorial to a pathway, add its name to one `more:` list, or to
# `tutorials:` if a reader cannot do without it.
# Pathways are named for a reader's goal, never for a numbered session or a date.

schema: 1

# Bump on a meaningful change to the pathways (AGENTS.md rule 7), not on typo fixes.
revised: "2026-11-16"

# The five points. `competency` names what the point builds; `can_do` is the
# sentence shown under the point's heading. `reflection` is the one optional
# prompt at the end of the point. `skip_check` names the self-checks (from
# `checks:` below) that let a reader who answers them all skip the point; a
# point without one has no skip-check.
points:
  p1:
    title: Orient and navigate
    competency: Work in MESA
    can_do: You can get into MESA, find data, run an app, and keep what you make.
    reflection: What would you do first if a file you saved was not where you expected it?
    skip_check: [shared-or-community, where-a-file-is-kept, how-the-app-ended]
  p2:
    title: Run and understand
    competency: Understand data
    can_do: >-
      You can say what a dataset holds and where it is incomplete or doubtful,
      before you compute with it.
    reflection: What would you check first if this result looked wrong?
    skip_check: [zero-readings, largest-unflagged, rows-without-repeats]
  p3:
    title: Query and connect
    competency: Query and connect
    can_do: >-
      You can ask questions across files and tables, and show that combining
      them did what you meant.
    reflection: After combining two tables, what tells you that nothing was added or lost?
    skip_check: [rows-in-centimetres, readings-above-twenty]
  p4:
    title: Explore and verify
    competency: Explore with AI and verify
    can_do: You can work with an AI assistant and test what it tells you against the data.
    reflection: What would make you trust, or not trust, an answer an AI assistant gave you?
    skip_check: [wettest-after-cleaning]
  p5:
    title: Preserve and share
    competency: Preserve and share
    can_do: You can leave work that someone else can find, understand, and run again.
    reflection: What would someone else need from you to run this again without asking you?

# Minutes [least, most] for a page that has no "**Time:**" line.
times:
  practice-data: [5, 5]

# What the reader set out to do, for a page that has no "**You will:**" line. It
# completes the sentence "You set out to ...".
outcomes:
  practice-data: have the practice files in your Data Store, and know what each one holds.

# What a tutorial builds on is read from the links in its "You need" line. List a
# tutorial here only where one of those links names an app or an optional source,
# not an earlier task; the list given replaces the links.
builds_on:
  r-tally-a-quality-flag: [r-load-a-file]
  desktop-open-a-file: [sign-in]
  preview-a-table: [sign-in]
  vscode-run-a-script: [sign-in]

# Goal-based routes. Each is short on purpose: `tutorials:` holds the
# essentials, the few a reader must do, and `more:` holds what to take with
# more time. A stage is one pathway point, in the order the reader meets it; a
# stage may hold only `more:`. The essentials of a pathway may not add up to
# more than `essentials_minutes`, and a stage shows at most seven of them.
# `after` names the pathway to suggest to a reader new to the portal; `note`
# is one sentence shown under the total.
essentials_minutes: 25

pathways:
  - id: new-to-mesa
    title: New to MESA
    promise: Sign in, start a notebook, and keep what you make.
    stages:
      - point: p1
        tutorials:
          - sign-in
          - launch-jupyterlab
          - save-your-work
        more:
          - request-app-access
          - find-your-way-around
          - find-community-data
          - stop-app-find-results

  - id: get-ready-for-a-session
    title: Get ready for a hands-on session
    promise: Arrive signed in, with an app that starts and the practice data loaded.
    note: >-
      Do the first two at least two days before. A new CyVerse account has to
      ask once for access to apps, and CyVerse says it answers within one to
      two days. "Ask CyVerse for access to interactive apps", under the first
      point, shows how.
    stages:
      - point: p1
        tutorials:
          - sign-in
          - launch-jupyterlab
        more:
          - request-app-access
          - find-your-way-around
          - save-your-work
          - stop-app-find-results
      - point: p2
        tutorials:
          - practice-data
          - load-a-file
        more:
          - read-the-data-dictionary
          - check-range-and-missing
          - tally-a-quality-flag
      - point: p3
        more:
          - reconcile-a-join
      - point: p4
        more:
          - check-a-suggested-result
      - point: p5
        more:
          - leave-a-rerunnable-notebook

  - id: check-a-dataset
    title: Check a dataset before you trust it
    promise: Find out what a dataset holds and where it is incomplete or doubtful.
    after: new-to-mesa
    stages:
      - point: p2
        tutorials:
          - practice-data
          - load-a-file
          - read-the-data-dictionary
          - check-range-and-missing
          - tally-a-quality-flag
        more:
          - count-records-per-day
          - local-days-from-utc
          - work-with-a-long-table
      - point: p3
        more:
          - reconcile-a-join
          - query-parquet-with-duckdb
          - convert-units-before-comparing
          - remove-a-repeated-row
          - join-and-keep-unmatched

  - id: work-in-r
    title: Work in R
    promise: Load the practice data in MESA RStudio Geospatial and check its flags.
    after: new-to-mesa
    stages:
      - point: p2
        tutorials:
          - r-load-a-file
          - r-tally-a-quality-flag
        more:
          - map-points-in-rstudio
      - point: p3
        more:
          - r-query-parquet-with-duckdb

  - id: use-an-ai-agent
    title: Use an AI agent and check what it says
    promise: Test what an AI assistant tells you against the data, then start an agent of your own.
    after: new-to-mesa
    stages:
      - point: p2
        tutorials:
          - practice-data
          - load-a-file
        more:
          - tally-a-quality-flag
      - point: p3
        more:
          - keep-secrets-out-of-files
      - point: p4
        tutorials:
          - check-a-suggested-result
        more:
          - start-an-ai-agent
          - keep-an-ai-log

  - id: leave-work-others-can-rerun
    title: Leave work others can rerun
    promise: Describe your work and leave a notebook that someone else can run again.
    after: new-to-mesa
    stages:
      - point: p5
        tutorials:
          - write-a-readme
          - leave-a-rerunnable-notebook
        more:
          - add-metadata
          - record-software-versions
          - say-where-data-came-from
          - hand-over-and-rerun
      - point: p3
        more:
          - save-a-query
      - point: p1
        more:
          - share-a-folder
          - read-shared-metadata
          - stop-sharing-a-folder

# Tailoring: how a reader's answers to "Where are you starting?" shorten a
# pathway. The answers stay in the reader's browser.
#   foundations  point 2 tutorials kept even for a reader who has checked a
#                dataset before, because later tutorials need what they set up
#   in_r         for a reader working in R: the R tutorial that replaces a
#                Python one, or nothing (~) where R does not need the step
tailoring:
  foundations: [practice-data, load-a-file, r-load-a-file]
  in_r:
    load-a-file: r-load-a-file
    tally-a-quality-flag: r-tally-a-quality-flag
    query-parquet-with-duckdb: r-query-parquet-with-duckdb
    practice-data: ~
    launch-jupyterlab: ~

# Hand-written pages to list with the pathways in docs/pathways/index.md, as
# paths under docs/.
also_list:
  - progress.md

# The complete list at docs/pathway.md: every tutorial under its point, in
# groups of at most seven. The first group of a point may go without a title.
# A tutorial left out is added to the end of its point, with a notice when the
# generator runs, so a new tutorial appears there with no edit to this file.
by_point:
  p1:
    - tutorials:
        - sign-in
        - find-your-way-around
        - find-community-data
        - request-app-access
        - launch-jupyterlab
        - save-your-work
        - stop-app-find-results
    - title: Organise folders
      tutorials: [make-a-folder, rename-a-folder, move-folders, trash-and-restore]
    - title: Find and look
      tutorials: [search-the-data-browser, browse-a-large-folder, view-a-notebook, preview-a-table]
    - title: Run apps
      tutorials: [launch-with-options, monitor-and-extend, check-your-usage]
    - title: The other MESA apps
      tutorials: [cloud-shell-download, vscode-run-a-script, desktop-open-a-file]
    - title: Share
      tutorials: [share-a-folder, read-shared-metadata, stop-sharing-a-folder]
  p2:
    - tutorials:
        - practice-data
        - load-a-file
        - read-the-data-dictionary
        - check-range-and-missing
        - tally-a-quality-flag
        - count-records-per-day
    - title: More kinds of table
      tutorials: [local-days-from-utc, work-with-a-long-table]
    - title: In R, in MESA RStudio Geospatial
      tutorials: [r-load-a-file, r-tally-a-quality-flag, map-points-in-rstudio]
  p3:
    - tutorials:
        - query-parquet-with-duckdb
        - reconcile-a-join
        - keep-secrets-out-of-files
        - r-query-parquet-with-duckdb
    - title: Combine and clean
      tutorials: [join-and-keep-unmatched, convert-units-before-comparing, remove-a-repeated-row, save-a-query]
  p4:
    - tutorials:
        - start-an-ai-agent
        - check-a-suggested-result
        - keep-an-ai-log
  p5:
    - tutorials:
        - write-a-readme
        - add-metadata
        - record-software-versions
        - leave-a-rerunnable-notebook
        - say-where-data-came-from
        - hand-over-and-rerun

# Self-checks: short questions whose answer comes from doing the task.
#
#   tutorial   the tutorial the question belongs to
#   ask        the question; `backticks` mark code
#   answer     a number, or (with `options`) the text of the right choice
#   options    for a choice question: every choice, the right one included
#   unit       optional; shown after a number
#   how        optional; the line of code that gets the answer, shown with it
#   verify     how CI confirms the answer against the practice data:
#                python: code whose last line is the value (pandas as pd, duckdb,
#                        and the tables readings, gauges, sites, obs are loaded)
#                r:      one R expression (readings and gauges are loaded)
#              A question with no `verify` is about a portal screen. It is
#              labelled "not machine-checked" and may only draw on a tutorial
#              that has been followed on the live portal.
#   right      one sentence shown with a correct answer
#   slips      likely wrong answers, each with one sentence naming the slip
#   otherwise  shown for any other wrong answer
#
# Ask for something the tutorial does not print, reached by a small variation on
# what it taught; otherwise the answer can be read off the page without doing
# the task. Answers here are public and are for self-study only (AGENTS.md
# rule 13: no answer keys for sessions).
checks:
  last-row:
    tutorial: load-a-file
    ask: Show the last row of `readings`. Which gauge and day is it?
    options: ["G01, 2026-07-01", "G03, 2026-07-31", "G05, 2026-07-09", "G05, 2026-07-31"]
    answer: "G05, 2026-07-31"
    how: readings.tail(1)
    verify:
      python: |
        ", ".join(readings.iloc[-1][["gauge_id", "date"]])
    right: The file runs gauge by gauge, so it ends with G05 on the last day of July.
    slips:
      "G01, 2026-07-01": That is the first row, which `head()` shows. `tail()` shows the end.
    otherwise: Run `readings.tail(1)` and read the `gauge_id` and `date` columns.

  g02-in-millimetres:
    tutorial: read-the-data-dictionary
    ask: The largest reading at G02 is 2.92. What is it in millimetres?
    answer: 29.2
    unit: mm
    verify:
      python: |
        round(readings.loc[readings["gauge_id"] == "G02", "value"].max() * 10, 1)
    right: G02 reports in centimetres, and a centimetre is ten millimetres.
    slips:
      "2.92": That is the value as stored, in centimetres. It has not been converted.
      "0.292": That divides by ten. Centimetres to millimetres multiplies by ten.
    otherwise: Find G02's unit in `gauges`, then convert 2.92 to millimetres.

  zero-readings:
    tutorial: check-range-and-missing
    ask: How many readings have a `value` of exactly 0?
    answer: 80
    how: (readings["value"] == 0).sum()
    verify:
      python: |
        int((readings["value"] == 0).sum())
    right: More than half of the 152 readings are dry days.
    slips:
      "150": That is the number of blank flags. The question is about `value`.
      "72": Those are the readings above 0.
      "0": No `value` is blank, but 80 of them are zero. A zero is a measurement, not a gap.
    otherwise: Compare `value` with 0 and add up the matches.

  largest-unflagged:
    tutorial: tally-a-quality-flag
    ask: Leave out the flagged readings. What is the largest `value` that remains?
    answer: 32.5
    how: readings.loc[readings["flag"] != "S", "value"].max()
    verify:
      python: |
        readings.loc[readings["flag"] != "S", "value"].max()
    right: Without the suspect reading of 180, the largest is an ordinary wet day at G03.
    slips:
      "180": The flagged reading is still in. Keep only the rows whose flag is not `S`.
      "2.92": That is the largest at G02 alone.
    otherwise: Keep the rows whose flag is not `S`, then take the largest `value`.

  rows-without-repeats:
    tutorial: count-records-per-day
    ask: Remove exact repeats with `drop_duplicates()`. How many rows remain?
    answer: 151
    how: len(readings.drop_duplicates())
    verify:
      python: |
        len(readings.drop_duplicates())
    right: One row, G03 on 5 July, is written twice, so 152 becomes 151.
    slips:
      "152": That is the table as loaded. One row for G03 is written twice.
      "155": That is a complete table, 5 gauges for 31 days. This one has four missing days as well as a repeat.
      "1": That is how many rows are removed, not how many remain.
    otherwise: Count the rows of `readings.drop_duplicates()`.

  rainy-local-days:
    tutorial: local-days-from-utc
    ask: In local time, on how many days of the week did rain fall at G03?
    answer: 5
    verify:
      python: |
        rain = obs[obs["measurement"] == "rain_mm"].copy()
        rain["day"] = pd.to_datetime(rain["timestamp_utc"]).dt.tz_convert("America/Denver").dt.date
        int((rain.groupby("day")["value"].sum() > 0).sum())
    right: Two of the seven local days were dry.
    slips:
      "6": That counts UTC dates. Evening rain crosses midnight UTC, so it spills into an extra date.
      "7": That counts every day of the week. Two had no rain.
      "8": That is the number of UTC dates the week touches, wet or dry.
    otherwise: Convert to local time, total the rain for each local day, and count the totals above 0.

  rainy-hours:
    tutorial: work-with-a-long-table
    ask: In how many of the 168 hours is `rain_mm` above 0?
    answer: 17
    how: (wide["rain_mm"] > 0).sum()
    verify:
      python: |
        wide = obs.pivot(index="timestamp_utc", columns="measurement", values="value")
        int((wide["rain_mm"] > 0).sum())
    right: Rain fell in about one hour in ten.
    slips:
      "168": That is every hour. Most of them are dry.
      "336": That is every row of the long table, both measurements together.
    otherwise: In the reshaped table, compare `rain_mm` with 0 and add up the matches.

  rows-in-centimetres:
    tutorial: reconcile-a-join
    ask: After the join, how many rows have a `unit` of `cm`?
    answer: 31
    how: (joined["unit"] == "cm").sum()
    verify:
      python: |
        joined = readings.merge(gauges, on="gauge_id", how="left", validate="many_to_one")
        int((joined["unit"] == "cm").sum())
    right: Only G02 reports in centimetres, and it has 31 readings.
    slips:
      "1": That counts gauges. The join gives every one of G02's readings its unit.
      "121": Those are the rows in millimetres.
    otherwise: Count the rows of `joined` whose `unit` is `cm`.

  readings-above-twenty:
    tutorial: query-parquet-with-duckdb
    ask: With one SQL query on `readings.parquet`, count the readings above 20.
    answer: 19
    how: duckdb.sql("SELECT count(*) FROM 'readings.parquet' WHERE value > 20")
    verify:
      python: |
        duckdb.sql("SELECT count(*) FROM 'readings.csv' WHERE value > 20").fetchall()[0][0]
    right: The count mixes units, as the file does, so G02's centimetre values never pass 20.
    slips:
      "10": That is the count above 25.
      "152": That is every row. Add `WHERE value > 20`.
    otherwise: Use `SELECT count(*)` with `WHERE value > 20`.

  wettest-after-cleaning:
    tutorial: check-a-suggested-result
    ask: >-
      Convert G02 to millimetres, leave out the flagged readings, and drop the
      repeated row. Which gauge then has the largest July total?
    options: ["G05, 210.9 mm", "G03, 251.1 mm", "G03, 273.6 mm", "G05, 390.9 mm"]
    answer: "G03, 251.1 mm"
    verify:
      python: |
        clean = readings.merge(gauges, on="gauge_id", validate="many_to_one")
        clean["mm"] = clean["value"].where(clean["unit"] == "mm", clean["value"] * 10)
        clean = clean[clean["flag"] != "S"].drop_duplicates(subset=["gauge_id", "date"])
        totals = clean.groupby("gauge_id")["mm"].sum().round(1)
        f"{totals.idxmax()}, {totals.max()} mm"
    right: >-
      Observatory leads once the data is cleaned. G01 is still missing four
      days, so even this is not yet a fair comparison.
    slips:
      "G05, 390.9 mm": That total includes the reading of 180 that the sensor flagged as suspect.
      "G05, 210.9 mm": That is G05 without its flagged reading, but G03 is higher.
      "G03, 273.6 mm": The repeated row for 5 July is still counted twice.
    otherwise: Apply all three steps, then total by gauge.

  missing-flags-in-r:
    tutorial: r-load-a-file
    ask: What does `sum(is.na(readings$flag))` return?
    answer: 150
    verify:
      r: sum(is.na(readings$flag))
    right: All but two readings have a blank flag, and `na.strings = ""` reads a blank as missing.
    slips:
      "0": The file was read without `na.strings = ""`, so blanks are empty text, not missing values.
      "2": Those are the flagged readings. `is.na()` counts the ones with no flag.
    otherwise: Read the file with `na.strings = ""`, then run the line.

  northernmost-gauge:
    tutorial: map-points-in-rstudio
    ask: Which gauge is furthest north?
    options: ["G01, Boathouse", "G02, Orchard", "G03, Observatory", "G05, Quarry"]
    answer: "G03, Observatory"
    verify:
      python: |
        top = sites.merge(gauges, on="gauge_id").sort_values("latitude").iloc[-1]
        f"{top['gauge_id']}, {top['name']}"
    right: Observatory has the largest latitude, so it sits at the top of the map.
    slips:
      "G05, Quarry": Quarry has the smallest latitude. It is furthest south.
      "G01, Boathouse": Boathouse is furthest west. Its longitude is the most negative.
    otherwise: North is up on the map, and larger latitude is further north.

  shared-or-community:
    tutorial: find-community-data
    ask: >-
      The path you copied stops at `/iplant/home/shared`, and the listing holds
      many projects that are not MESA's. Which did you click?
    options: ["Community", "Shared", "User Shared"]
    answer: "Shared"
    right: Shared opens every CyVerse community project. Community is the MESA folder inside it.
    slips:
      "Community": Community opens the MESA folder, and its path goes on to `/iplant/home/shared/mesa`.
    otherwise: Look at where the path ends. The MESA folder's path ends in `mesa`.

  where-a-file-is-kept:
    tutorial: save-your-work
    ask: Which of these tells you that a file will still be there after the app stops?
    options:
      - "It is listed in JupyterLab's file browser"
      - "The dot on the notebook's tab has gone"
      - "It is listed under My Files in the portal"
    answer: "It is listed under My Files in the portal"
    right: The Data Browser reads the Data Store directly, not the running app.
    slips:
      "It is listed in JupyterLab's file browser": JupyterLab also lists files on the app's own disk, which is removed when the app ends.
      "The dot on the notebook's tab has gone": That means the notebook is saved, but not where. It may be on the app's own disk.
    otherwise: Ask which place shows the Data Store itself.

  how-the-app-ended:
    tutorial: stop-app-find-results
    ask: Your analysis is listed under Canceled, not Completed. Which button ended it?
    options: ["Relaunch", "Save & Exit", "Terminate"]
    answer: "Terminate"
    right: Terminate ends the app at once without saving its outputs.
    slips:
      "Save & Exit": Save & Exit stops the app cleanly, and the analysis is then listed under Completed.
      "Relaunch": Relaunch starts the app again with the same settings. It does not end one.
    otherwise: One button stops the app cleanly, and one ends it at once.
