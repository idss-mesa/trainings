name: Trainings site

on:
  push:
    branches: [main]
  # Validation (incl. the llms.txt drift check) on PRs, so problems surface
  # before merge rather than after.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Validate that every page conforms to the Open Knowledge Format (OKF v0.2)
  okf-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install pyyaml
      - run: python scripts/okf_validate.py docs
      # Fail if the pathway pages drifted from data/pathways.yml and the
      # tutorials. This runs before gen_llms_txt.py, which indexes those pages.
      - run: python -m unittest discover tests
      # The learner-progress logic the pages load, run under Node.
      - run: node --test tests/progress.test.js
      - run: |
          python scripts/gen_pathways.py
          test -z "$(git status --porcelain docs/pathways docs/pathway.md docs/assets/pathways.json)" \
            || { git status --short docs; git diff docs; exit 1; }
      # Fail if the llms.txt machine-readable indexes drifted from the pages.
      - run: |
          python scripts/gen_llms_txt.py
          git diff --exit-code docs/llms.txt docs/llms-full.txt

  # Run the tutorials' code against the practice data and compare it with the
  # output printed on each page. Versions match MESA JupyterLab.
  tutorial-outputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install pandas==3.1.1 duckdb==2.0.0
      - run: python scripts/check_tutorial_outputs.py
      # The practice data must be what its generator writes.
      - run: |
          python scripts/make_practice_data.py
          git diff --exit-code docs/assets/practice

  # The same check for the R tutorials, inside the MESA RStudio Geospatial image
  # that readers use, so R, sf, and duckdb are the versions they will have.
  tutorial-outputs-r:
    runs-on: ubuntu-latest
    container:
      image: harbor.cyverse.org/vice/mesa-rstudio:latest
      options: --user root
    steps:
      - uses: actions/checkout@v7
      - run: Rscript scripts/check_tutorial_outputs.R

  # Follow a pathway in a real browser against the built site: mark tutorials
  # done, export, clear, import and compare; then read it with JavaScript off.
  pathways-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical pyyaml playwright
      - run: playwright install --with-deps chromium
      - run: zensical build --clean --strict
      - run: python scripts/postbuild_agent_surface.py site
      - run: python tests/e2e/test_browser.py

  deploy:
    needs: [okf-conformance, tutorial-outputs, tutorial-outputs-r, pathways-browser]
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical pyyaml
      - run: zensical build --clean --strict
      # Agent surface: markdown mirror, OKF meta injection, robots.txt
      - run: python scripts/postbuild_agent_surface.py site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
