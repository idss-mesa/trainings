[project]
site_name = "MESA Trainings"
site_description = "MESA Trainings: short, single-task tutorials for the MESA Portal at mesa.cyverse.org and its apps, written for training participants and for anyone using MESA."
site_author = "idss-mesa"
site_url = "https://idss-mesa.github.io/trainings/"
repo_url = "https://github.com/idss-mesa/trainings"
repo_name = "idss-mesa/trainings"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 The Regents of the University of New Mexico. Training content is licensed <a href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0</a>; code is BSD 3-Clause. For AI agents: <a href=\"https://idss-mesa.github.io/trainings/llms.txt\">llms.txt</a> &middot; <a href=\"https://idss-mesa.github.io/trainings/llms-full.txt\">llms-full.txt</a> &middot; <a href=\"https://idss-mesa.github.io/trainings/about/ai-agents/\">agent guide</a>."

# TOML: bare keys attach to the most recent [table] header, so every
# [project] key — extra_css and nav included — must stay above the first
# [project.*] header.
extra_css = ["stylesheets/extra.css"]

# Explicit navigation. A new tutorial is one line here and one bullet in
# docs/tutorials/index.md.
nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
      "tutorials/index.md",
      { "Sign in to the MESA Portal" = "tutorials/sign-in.md" },
      { "Find MESA's community data" = "tutorials/find-community-data.md" },
      { "Launch MESA JupyterLab" = "tutorials/launch-jupyterlab.md" },
      { "Save your work" = "tutorials/save-your-work.md" },
      { "Stop an app and find your results" = "tutorials/stop-app-find-results.md" },
  ] },
  { "Contributing" = [
      { "Contribute a tutorial" = "contributing.md" },
      { "Tutorial template" = "template.md" },
  ] },
  { "About" = [
      "about/index.md",
      { "License" = "about/license.md" },
      { "For AI agents" = "about/ai-agents.md" },
      { "Changelog" = "log.md" },
  ] },
  # Back to the rest of MESA, as in the main site's navigation.
  { "MESA website" = "https://idss-mesa.github.io/" },
  { "Documentation" = "https://idss-mesa.github.io/docs/" },
  { "Portal" = "https://mesa.cyverse.org" },
]

[project.theme]
language = "en"
logo = "assets/mesa-logo.svg"
favicon = "assets/favicon-32.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.code.select",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# One light scheme, as on the main MESA site; the colors themselves are set
# in docs/stylesheets/extra.css from that site's tokens.
[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"

[project.theme.font]
text = "Archivo"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/idss-mesa"

# Markdown extensions (the same set as idss-mesa/docs).
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
